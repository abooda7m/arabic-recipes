<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | وصفاتي العربية</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div id="auth-links" class="d-none"></div>
  <div id="user-menu"  class="d-none"></div>

  <div class="auth-card">
    <div class="auth-logo">وصفاتي العربية</div>
    <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:1.8rem">إنشاء حساب جديد</h2>

    <div id="error-msg" class="error-msg mb-3 d-none"></div>

    <form id="register-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">اسم المستخدم</label>
        <input type="text" class="form-control" id="username" placeholder="اسمك هنا" required minlength="3">
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">كلمة المرور</label>
        <input type="password" class="form-control" id="password" placeholder="6 أحرف على الأقل" required minlength="6">
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm-password">تأكيد كلمة المرور</label>
        <input type="password" class="form-control" id="confirm-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary-custom w-100" style="border-radius:14px;padding:13px">
        إنشاء الحساب
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;color:var(--muted)">
      لديك حساب بالفعل؟
      <a href="/login.html" style="color:var(--primary);font-weight:700">سجل الدخول</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/ApiClient.js"></script>
  <script src="/js/AuthManager.js"></script>
  <script src="/js/RecipeManager.js"></script>
  <script src="/js/UIManager.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

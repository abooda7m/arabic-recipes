<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصفة | وصفاتي العربية</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">وصفاتي العربية</a>
      <button class="navbar-toggler border-secondary" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="/">الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="/recipes.html">الوصفات</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <div id="auth-links" class="d-flex gap-2">
            <a href="/login.html" class="btn btn-outline-light btn-sm" style="font-family:Cairo;font-weight:700">تسجيل الدخول</a>
            <a href="/register.html" class="btn-primary-custom" style="padding:8px 20px;font-size:.88rem">إنشاء حساب</a>
          </div>
          <div id="user-menu" class="d-none d-flex align-items-center gap-2">
            <a href="/add-recipe.html" class="btn-primary-custom" style="padding:8px 18px;font-size:.88rem">+ وصفة جديدة</a>
            <div class="dropdown">
              <button class="btn btn-outline-light btn-sm dropdown-toggle" style="font-family:Cairo;font-weight:700"
                      data-bs-toggle="dropdown">
                <span id="username-display"></span>
              </button>
              <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-start">
                <li><button class="dropdown-item" id="logout-btn" style="font-family:Cairo">تسجيل الخروج</button></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div style="background:var(--dark-2);padding:.8rem 0;border-bottom:1px solid var(--border)">
    <div class="container">
      <nav style="font-size:.88rem;color:var(--muted)">
        <a href="/" style="color:var(--muted)">الرئيسية</a> ←
        <a href="/recipes.html" style="color:var(--muted)">الوصفات</a> ←
        <span style="color:var(--primary)" id="breadcrumb-title">...</span>
      </nav>
    </div>
  </div>

  <!-- Recipe Detail -->
  <main style="padding:2.5rem 0 4rem">
    <div class="container">
      <div id="detail-container"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p style="font-size:1.2rem;font-weight:900;color:var(--primary)">وصفاتي العربية</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/ApiClient.js"></script>
  <script src="/js/AuthManager.js"></script>
  <script src="/js/RecipeManager.js"></script>
  <script src="/js/UIManager.js"></script>
  <script src="/js/app.js"></script>

  <script>
    // Update breadcrumb after detail renders
    const observer = new MutationObserver(() => {
      const h1 = document.querySelector('#detail-container h1');
      const bc = document.getElementById('breadcrumb-title');
      if (h1 && bc) { bc.textContent = h1.textContent; observer.disconnect(); }
    });
    observer.observe(document.getElementById('detail-container') || document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
